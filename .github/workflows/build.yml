name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Catrobat/Catroid
          path: catroid-src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Пустой "проект-пустышка": Catroid при сборке standalone скачивает проект по URL
      - name: Prepare dummy project and local server
        shell: bash
        run: |
          mkdir -p dummy && cd dummy
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><program><header><programName>Player</programName></header></program>' > code.xml
          zip dummy.catrobat code.xml
          nohup python3 -m http.server 8000 > /dev/null 2>&1 &
          sleep 2
          curl -sI http://localhost:8000/dummy.catrobat | head -1

      # Делаем плеер "говорящим": при ошибке загрузки проекта он покажет причину на экране
      - name: Patch Catroid to show load errors
        shell: bash
        run: |
          cd catroid-src
          python3 - <<'PY'
          import re
          def patch(path, old, new):
              s = open(path, encoding="utf-8").read()
              assert s.count(old) == 1, (path, old, s.count(old))
              open(path, "w", encoding="utf-8").write(s.replace(old, new))

          PL = "catroid/src/main/java/org/catrobat/catroid/io/asynctask/ProjectLoader.kt"
          patch(PL, "        val TAG = ProjectLoader::class.java.simpleName",
                "        val TAG = ProjectLoader::class.java.simpleName\n        @JvmField\n        var lastError: String = \"\"")
          patch(PL, 'Log.e(ProjectLoader.TAG, "Cannot load project in " + projectDir.absolutePath, e)',
                'Log.e(ProjectLoader.TAG, "Cannot load project in " + projectDir.absolutePath, e)\n'
                '        ProjectLoader.lastError = e.toString() + " | cause: " + (e.cause?.toString() ?: "-") + " | " + e.stackTrace.take(3).joinToString(" ; ") + " | dir: " + projectDir.absolutePath')

          MM = "catroid/src/main/java/org/catrobat/catroid/ui/MainMenuActivity.kt"
          patch(MM, "    override fun onLoadFinished(success: Boolean) {",
                '    override fun onLoadFinished(success: Boolean) {\n'
                '        if (!success) android.app.AlertDialog.Builder(this).setMessage("LOAD FAILED: " + ProjectLoader.lastError).setPositiveButton("OK", null).show()')
          patch(MM, "    private fun prepareStandaloneProject() {",
                '    private fun prepareStandaloneProject() {\n'
                '        android.widget.Toast.makeText(this, "STANDALONE: start", android.widget.Toast.LENGTH_SHORT).show()')
          patch(MM, 'Log.e("STANDALONE", "Cannot unpack standalone project: ", e)',
                'Log.e("STANDALONE", "Cannot unpack standalone project: ", e)\n'
                '            android.app.AlertDialog.Builder(this).setMessage("UNPACK FAILED: " + e.toString()).setPositiveButton("OK", null).show()')
          print("patched OK")
          PY

      - name: Build Catroid standalone player
        shell: bash
        run: |
          cd catroid-src
          chmod +x gradlew
          ./gradlew assembleStandaloneDebug -Pdownload=http://localhost:8000/dummy.catrobat -Psuffix=project --no-daemon --console=plain 2>&1 | tee ../catroid-build.log

      - name: Show Catroid error (only on failure)
        if: failure()
        shell: bash
        run: |
          echo "===== ОШИБКИ КОМПИЛЯЦИИ (строки e:) ====="
          grep -n "^e: " catroid-build.log | head -20 || true
          echo "===== ПРИЧИНА ПАДЕНИЯ ====="
          grep -n -A12 "What went wrong" catroid-build.log | head -40 || true
          echo "===== КОНЕЦ ЛОГА ====="
          tail -n 25 catroid-build.log

      - name: Find player APK
        shell: bash
        run: |
          APK=$(find catroid-src -path "*build/outputs/apk*" -name "*.apk" | head -n 1)
          echo "Found: $APK"
          mkdir -p out
          cp "$APK" out/player_template.apk
          ls -la out
          echo "=== Нужные файлы в плеере ==="
          unzip -l out/player_template.apk | grep -E "assets/[A-Za-z0-9_]+\.zip|nodpi|/icon|AndroidManifest" || true
          echo "=== Манифест ==="
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | tail -n 1)aapt2
          $AAPT dump badging out/player_template.apk | grep -E "^package|application-label:|application-icon|launchable" | head -10 || true

      - name: Save player as artifact
        uses: actions/upload-artifact@v4
        with:
          name: player-template
          path: out/player_template.apk

      - name: Unpack my app
        run: unzip -o CatApk.zip -d proj

      - name: Put player into my app assets
        shell: bash
        run: |
          mkdir -p proj/app/src/main/assets
          cp out/player_template.apk proj/app/src/main/assets/player_template.apk
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | tail -n 1)aapt2
          $AAPT dump resources out/player_template.apk > res-dump.txt || true
          echo "=== drawable/icon в таблице ресурсов ==="
          grep -n "drawable/icon$" res-dump.txt | head -5 || true
          HEX=$(grep -oE "0x7f[0-9a-f]{6} drawable/icon$" res-dump.txt | head -n 1 | cut -d' ' -f1)
          echo "ICON HEX: $HEX"
          if [ -n "$HEX" ]; then printf '%d' "$HEX" > proj/app/src/main/assets/icon_res_id.txt; fi
          ls -la proj/app/src/main/assets

      - name: Create signing key
        run: |
          keytool -genkeypair -alias key -keyalg RSA -keysize 2048 -validity 10000 \
            -storetype PKCS12 -keystore proj/app/src/main/assets/signing.p12 \
            -storepass android -keypass android -dname "CN=CatApk"

      - name: Build my app
        run: cd proj && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CatApk
          path: proj/app/build/outputs/apk/debug/*.apk
