name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false
    steps:
      # 1. Мой репозиторий (CatApk.zip)
      - uses: actions/checkout@v4

      # 2. Исходники Catroid (Pocket Code) — публичный репозиторий, форк не обязателен
      - uses: actions/checkout@v4
        with:
          repository: Catrobat/Catroid
          path: catroid-src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # 2.5. Диагностика: как в Catroid устроен standalone
      - name: Inspect Catroid standalone support
        shell: bash
        run: |
          cd catroid-src
          echo "=== Файлы со словом standalone (скрипты сборки) ==="
          grep -rIl -i "standalone" --include=*.gradle --include=*.kts --include=*.properties --include=*.sh --include=*.py . 2>/dev/null | head -30 || true
          echo "=== Строки в gradle ==="
          grep -rIn -i "standalone\|apk_generator" --include=*.gradle --include=*.kts . 2>/dev/null | head -60 || true
          echo "=== Манифест ==="
          grep -rn -i "standalone" --include=AndroidManifest.xml . 2>/dev/null | head -20 || true
          echo "=== Код ==="
          grep -rIn "APK_GENERATOR\|isStandalone\|STANDALONE" --include=*.kt --include=*.java catroid/src/main 2>/dev/null | head -40 || true
          echo "=== buildScripts ==="
          ls buildScripts 2>/dev/null | head -50 || true

      # 3. Собираем плеер Catroid
      - name: Build Catroid player
        shell: bash
        run: |
          cd catroid-src
          chmod +x gradlew
          ./gradlew assembleCatroidDebug --no-daemon --console=plain 2>&1 | tee ../catroid-build.log

      - name: Show Catroid error (only on failure)
        if: failure()
        shell: bash
        run: |
          echo "===== ОШИБКИ КОМПИЛЯЦИИ (строки e:) ====="
          grep -n "^e: " catroid-build.log | head -20 || true
          echo "===== ПРИЧИНА ПАДЕНИЯ ====="
          grep -n -A12 "What went wrong" catroid-build.log | head -40 || true
          echo "===== КОНЕЦ ЛОГА ====="
          tail -n 25 catroid-build.log

      - name: Find player APK
        run: |
          APK=$(find catroid-src -path "*build/outputs/apk*" -name "*.apk" | head -n 1)
          echo "Found: $APK"
          mkdir -p out
          cp "$APK" out/player_template.apk
          ls -la out
          echo "=== Содержимое плеера (для подгонки путей) ==="
          unzip -l out/player_template.apk | grep -iE "AndroidManifest|assets/|ic_launcher|\.catrobat|standalone" | head -150 || true
          echo "=== Манифест ==="
          $(ls -d $ANDROID_HOME/build-tools/*/ | tail -n 1)aapt2 dump badging out/player_template.apk | head -30 || true

      - name: Save player as artifact
        uses: actions/upload-artifact@v4
        with:
          name: player-template
          path: out/player_template.apk

      # 4. Мое приложение
      - name: Unpack my app
        run: unzip -o CatApk.zip -d proj

      - name: Put player into my app assets
        run: |
          mkdir -p proj/app/src/main/assets
          cp out/player_template.apk proj/app/src/main/assets/player_template.apk

      - name: Create signing key
        run: |
          keytool -genkeypair -alias key -keyalg RSA -keysize 2048 -validity 10000 \
            -storetype PKCS12 -keystore proj/app/src/main/assets/signing.p12 \
            -storepass android -keypass android -dname "CN=CatApk"

      - name: Build my app
        run: cd proj && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CatApk
          path: proj/app/build/outputs/apk/debug/*.apk
